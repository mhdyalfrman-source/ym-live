name: tom_chat
description: "Yaumi is a Flutter live voice chat and social room application with Firebase, Agora, wallet, gifts, and in-app purchase support."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: 4.7.3
  ionicons_plus: ^0.2.5
  flutter_screenutil: 
  get_storage:
  slide_to_act: 
  flutter_svg:
  image_picker:
  permission_handler:
  http:
  device_info_plus:
  easy_stepper: 
  omni_datetime_picker: 
  flutter_rating_bar: 
  pretty_qr_code: 
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  web_socket_channel:
  unique_identifier: 
  firebase_messaging: 
  timeago_flutter: 
  flutter_local_notifications: 
  flutter_staggered_grid_view:
  photo_view:
  flutter_secure_storage: 
  readmore:
  upgrader:
  day_night_switcher:
  popover: ^0.4.0
  random_password_generator: 
  animated_list_plus:
  stop_watch_timer: 
  tlv_decoder: 
  mobile_scanner: 
  vibration:
  google_sign_in: ^7.1.1
  in_app_purchase:
  bubble: ^1.2.1
  flutter_chat_ui: ^1.6.14
  animations:
  app_links: 6.2.0
  share_plus:
  flutter_colorpicker:
  location: 
  sqflite_sqlcipher: 
  awesome_gradiant_font: ^0.0.2
  just_audio: ^0.10.5
  file_picker: ^10.3.3
  hugeicons: 0.0.11
  socket_io_client:
  wakelock_plus:
  flutter_svga:
  flutter_keyboard_visibility:
  visibility_detector:
  cached_network_image:
  flutter_cache_manager:
  agora_rtc_engine: ^6.5.3
  country_picker:
  grouped_list:
  url_launcher: 
  photo_manager:
  flutter_localizations:
    sdk: flutter
  marquee:
  video_player:
  firebase_crashlytics: ^5.1.0
  webview_flutter: 4.10.0 


dependency_overrides:
  webview_flutter_android:
    path: local_plugins/webview_flutter_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4 #dart run flutter_launcher_icons
  rename: #  flutter pub global activate rename  ./rename setAppName --targets android,ios --value "Tom Chat"  ./rename setBundleId --targets android --value "com.yoursoft.quizme"



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  adaptive_icon_foreground: "assets/app_logo.png"
  adaptive_icon_background: "#ffffff"
  #https://stackoverflow.com/questions/65391820/change-background-color-of-flutter-app-icon
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  background_color_ios: "#FFC529"
  windows:
    generate: true
    image_path: "assets/app_logo.png"
    icon_size: 48 # min:48, max:256, default: 48

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/rocket/
    - assets/svgs/
    - assets/svga/

  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/cairo.ttf
