name: Build ITS Connected APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android projects
        run: |
          flutter create --org com.mahdi.nabdqalbi --project-name sender sender
          flutter create --org com.mahdi.nabdqalbi --project-name receiver receiver
          cp pubspec.yaml sender/pubspec.yaml
          cp pubspec.yaml receiver/pubspec.yaml
          cp google-services.json sender/android/app/google-services.json
          cp google-services.json receiver/android/app/google-services.json
          mkdir -p sender/lib receiver/lib
          cp lib/main.dart sender/lib/main.dart
          cp lib/main.dart receiver/lib/main.dart
      - name: Configure Firebase Android Gradle plugin
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          for app in ("sender", "receiver"):
              android = Path(app) / "android"
              settings_kts = android / "settings.gradle.kts"
              settings_groovy = android / "settings.gradle"
              app_kts = android / "app" / "build.gradle.kts"
              app_groovy = android / "app" / "build.gradle"

              if settings_kts.exists():
                  settings = settings_kts
                  text = settings.read_text()
                  if "com.google.gms.google-services" not in text:
                      match = re.search(r"(?m)^(\s*)id\([\"']org\.jetbrains\.kotlin\.android[\"']\).*?$", text)
                      declaration = '    id("com.google.gms.google-services") version "4.4.2" apply false\n'
                      if match:
                          pos = match.end()
                          text = text[:pos] + "\n" + declaration.rstrip("\n") + text[pos:]
                      else:
                          raise SystemExit(f"Could not locate Kotlin plugin in {settings}")
                      settings.write_text(text)
                  app_gradle = app_kts
                  app_line = '    id("com.google.gms.google-services")\n'
              elif settings_groovy.exists():
                  settings = settings_groovy
                  text = settings.read_text()
                  if "com.google.gms.google-services" not in text:
                      match = re.search(r"(?m)^(\s*)id\s+[\"']org\.jetbrains\.kotlin\.android[\"'].*$", text)
                      declaration = '    id "com.google.gms.google-services" version "4.4.2" apply false'
                      if match:
                          text = text[:match.end()] + "\n" + declaration + text[match.end():]
                      else:
                          raise SystemExit(f"Could not locate Kotlin plugin in {settings}")
                      settings.write_text(text)
                  app_gradle = app_groovy
                  app_line = '    id "com.google.gms.google-services"\n'
              else:
                  raise SystemExit(f"No Gradle settings file found for {app}")

              gradle_text = app_gradle.read_text()
              gradle_text = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", gradle_text)
              gradle_text = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", gradle_text)
              app_gradle.write_text(gradle_text)
              if "com.google.gms.google-services" not in gradle_text:
                  match = re.search(r"(?m)^\s*id\([\"']com\.android\.application[\"']\).*?$|^\s*id\s+[\"']com\.android\.application[\"'].*$", gradle_text)
                  if not match:
                      raise SystemExit(f"No Android application plugin found in {app_gradle}")
                  pos = match.end()
                  gradle_text = gradle_text[:pos] + "\n" + app_line.rstrip("\n") + gradle_text[pos:]
                  app_gradle.write_text(gradle_text)
          print("Firebase Gradle plugin configured for both apps")
          PYCODE
      - name: Configure Android labels, notifications and background audio
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          for app, label in (("sender", "♛ 𝐈𝐓𝐒 : MINE ♛"), ("receiver", "#¹♥ 𝐈𝐓𝐒 : MY ♕︎.")):
              manifest = Path(app) / "android/app/src/main/AndroidManifest.xml"
              text = manifest.read_text()
              if 'xmlns:tools=' not in text:
                  text = text.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
              if 'android.permission.RECORD_AUDIO' not in text:
                  text = text.replace('<application', '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application', 1)
              if 'android.permission.INTERNET' not in text:
                  text = text.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
              for permission in ("android.permission.POST_NOTIFICATIONS", "android.permission.WAKE_LOCK", "android.permission.FOREGROUND_SERVICE", "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"):
                  if permission not in text:
                      text = text.replace('<application', f'<uses-permission android:name="{permission}" />\n    <application', 1)
              text = re.sub(r'android:label="[^"]*"', 'android:label="' + label + '"', text, count=1)
              text = text.replace('android:name=".MainActivity"', 'android:name="com.ryanheise.audioservice.AudioServiceActivity"', 1)
              if 'com.ryanheise.audioservice.AudioService"' not in text:
                  service = '<service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true" tools:ignore="Instantiatable"><intent-filter><action android:name="android.media.browse.MediaBrowserService" /></intent-filter></service>'
                  text = text.replace('</application>', service + '\n    </application>', 1)
              if 'com.ryanheise.audioservice.MediaButtonReceiver' not in text:
                  receiver = '<receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true" tools:ignore="Instantiatable"><intent-filter><action android:name="android.intent.action.MEDIA_BUTTON" /></intent-filter></receiver>'
                  text = text.replace('</application>', receiver + '\n    </application>', 1)
              manifest.write_text(text)
          print("Android names, FCM notification permission and background audio configured")
          PYCODE
      - name: Build sender APK
        working-directory: sender
        run: |
          flutter pub get
          flutter build apk --release --dart-define=ITS_SENDER=true
      - name: Build receiver APK
        working-directory: receiver
        run: |
          flutter pub get
          flutter build apk --release --dart-define=ITS_SENDER=false
      - name: Prepare APK files
        run: |
          mkdir -p dist
          cp sender/build/app/outputs/flutter-apk/app-release.apk dist/ITS-MINE.apk
          cp receiver/build/app/outputs/flutter-apk/app-release.apk dist/ITS-MY.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ITS-Connected-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
