name: Build ITS Connected APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android projects
        run: |
          flutter create --org com.itsmine --project-name its_sender sender
          flutter create --org com.itsmine --project-name its_receiver receiver
          cp pubspec.yaml sender/pubspec.yaml
          cp pubspec.yaml receiver/pubspec.yaml
          mkdir -p sender/lib receiver/lib
          cp lib/main.dart sender/lib/main.dart
          cp lib/main.dart receiver/lib/main.dart
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' sender/android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' receiver/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="its_sender"/android:label="ITS MINE"/' sender/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="its_receiver"/android:label="ITS MY"/' receiver/android/app/src/main/AndroidManifest.xml
      - name: Build sender APK
        working-directory: sender
        run: |
          flutter pub get
          flutter build apk --release --dart-define=ITS_SENDER=true
      - name: Build receiver APK
        working-directory: receiver
        run: |
          flutter pub get
          flutter build apk --release --dart-define=ITS_SENDER=false
      - name: Prepare APK files
        run: |
          mkdir -p dist
          cp sender/build/app/outputs/flutter-apk/app-release.apk dist/ITS-MINE.apk
          cp receiver/build/app/outputs/flutter-apk/app-release.apk dist/ITS-MY.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ITS-Connected-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
